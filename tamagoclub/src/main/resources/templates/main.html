<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Recipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
	rel="stylesheet">
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Poppins', sans-serif;
	background: linear-gradient(135deg, #fff8dc, #ffeaa7);
	min-height: 100vh;
	display: flex;
	justify-content: center;
	padding: 40px 20px;
}

/* 背景 */
.bg-circle {
	position: absolute;
	border-radius: 50%;
	background: rgba(255, 255, 255, 0.25);
	z-index: 0;
}

.circle1 {
	width: 300px;
	height: 300px;
	top: -80px;
	left: -80px;
}

.circle2 {
	width: 220px;
	height: 220px;
	bottom: -60px;
	right: -40px;
}

/* カード */
.container {
	width: 430px;
	background: rgba(255, 255, 255, 0.75);
	backdrop-filter: blur(12px);
	border-radius: 30px;
	padding: 40px 35px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
	position: relative;
	z-index: 1;
}

/* ロゴ */
.logo-area {
	text-align: center;
	margin-bottom: 35px;
}

.logo {
	font-size: 68px;
	margin-bottom: 10px;
}

.title {
	font-size: 38px;
	font-weight: 600;
	color: #f4a900;
}

.sub-title {
	margin-top: 8px;
	color: #777;
	font-size: 14px;
}

/* 検索 */
.search-area {
	display: flex;
	gap: 10px;
	margin-bottom: 35px;
}

.search-input {
	flex: 1;
	padding: 14px 16px;
	border: none;
	border-radius: 14px;
	background: #fff;
	font-size: 14px;
	outline: none;
	box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
}

.search-input:focus {
	box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.3);
}

/* 検索ボタン */
.search-btn {
	border: none;
	padding: 0 20px;
	border-radius: 14px;
	background: linear-gradient(135deg, #ffbf00, #ff9900);
	color: white;
	cursor: pointer;
	font-size: 16px;
	transition: 0.2s;
}

.search-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 8px 18px rgba(255, 170, 0, 0.35);
}

/* メニュー */
.nav-buttons {
	display: flex;
	flex-direction: column;
	gap: 18px;
}

/* ボタン */
.nav-btn {
	text-decoration: none;
	padding: 18px 20px;
	border-radius: 18px;
	background: #fff;
	color: #444;
	font-weight: 600;
	font-size: 16px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	transition: 0.25s;
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
}

.nav-btn:hover {
	transform: translateY(-4px);
	background: #fff8e6;
	box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
}

/* アイコン */
.nav-icon {
	font-size: 22px;
}

/* フッター */
.footer {
	margin-top: 28px;
	text-align: center;
	color: #999;
	font-size: 12px;
}
</style>
</head>

<body>


	<div class="bg-circle circle1"></div>
	<div class="bg-circle circle2"></div>

	<div class="container">

		<div class="logo-area">
			<div class="logo">🍳</div>
			<div class="title">たまログ</div>
			<div class="sub-title">たまご料理をもっと楽しく</div>
			<a th:href="@{/main/favorites}" style="color:#f4a900; font-size:13px; margin-top:4px; text-decoration:none;">
    👤 <span sec:authentication="name"></span> さん
</a>

		<!-- 検索 -->
		<form th:action="@{/main/search}" method="get">
			<!-- ★検索機能を作る場合 -->
			<div class="search-area">
				<input type="text" name="keyword" class="search-input"
					placeholder="たまログサーチ　[検索]">
				<button type="submit" class="search-btn">🔍</button>
			</div>
		</form>

		<!-- メニュー -->
		<div class="nav-buttons">

			<a th:href="@{/main/register}" class="nav-btn"> <!-- ★ href→th:href -->
				<span>📝 たまログ工房　[レシピ投稿]</span> <span class="nav-icon">→</span>
			</a> <a th:href="@{/main/list}" class="nav-btn"> <span>📚
					たまログ管理室　[一覧・編集]</span> <span class="nav-icon">→</span>
			</a> <a th:href="@{/main/ranking}" class="nav-btn"> <span>🏆
					たまログトレンド　[ランキング]</span> <span class="nav-icon">→</span>
			</a>

		</div>

		<!-- ログアウト -->
		<form th:action="@{/logout}" method="post"
			style="margin-top: 20px; text-align: center;">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}">
			<button type="submit"
				style="background: none; border: none; color: #999; cursor: pointer; font-size: 13px;">
				ログアウト</button>
		</form>

		<div class="footer">made with 🥚 by Team Egg</div>

	</div>
</body>
</html>
