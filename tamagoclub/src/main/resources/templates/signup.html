<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>新規登録 | たまログ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', 'Noto Sans JP', sans-serif;
  background: linear-gradient(135deg, #fff8dc, #ffe9a8);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 16px;
}

/* ===== HEADER ===== */
header {
  width: 100%;
  max-width: 1100px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.logo-text {
  font-size: 18px;
  font-weight: 600;
  color: #f0a500;
  text-decoration: none;
}

/* ===== CARD ===== */
.card {
  width: 100%;
  max-width: 460px;

  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(14px);

  border-radius: 28px;
  overflow: hidden;

  box-shadow: 0 12px 35px rgba(0,0,0,0.12);
}

/* ===== CARD HEADER ===== */
.card-header {
  background: linear-gradient(135deg, #ffbf00, #ff9900);
  padding: 26px 24px;
  text-align: center;
}

.card-header .icon {
  font-size: 40px;
  margin-bottom: 6px;
}

.card-header h1 {
  font-size: 22px;
  font-weight: 600;
  color: white;
}

.card-header p {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  margin-top: 4px;
}

/* ===== BODY ===== */
.card-body {
  padding: 26px;
}

/* ===== FORM ===== */
.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  margin-bottom: 6px;
}

.required {
  font-size: 10px;
  background: #fff0f0;
  color: #cc2222;
  padding: 2px 6px;
  border-radius: 6px;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;

  border: 1px solid rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.7);

  font-size: 14px;
  transition: 0.2s;
}

.form-input:focus {
  outline: none;
  background: #fff;
  border-color: #ffb300;
  box-shadow: 0 8px 20px rgba(255,153,0,0.15);
}

.form-input.is-error {
  border-color: #cc2222;
  background: #fff5f5;
}

.hint {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  display: block;
}

/* ===== PASSWORD STRENGTH ===== */
.strength-bars {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

.strength-bar {
  flex: 1;
  height: 4px;
  background: #e5e5e5;
  border-radius: 3px;
  transition: 0.2s;
}

.strength-bar.weak { background: #e53935; }
.strength-bar.fair { background: #fb8c00; }
.strength-bar.good { background: #43a047; }
.strength-bar.strong { background: #1e88e5; }

.strength-label {
  font-size: 11px;
  color: #777;
  margin-top: 4px;
  display: block;
}

/* ===== ERROR ===== */
.error-msg {
  font-size: 11px;
  color: #cc2222;
  margin-top: 4px;
}

/* ===== ALERT ===== */
.alert-error {
  background: rgba(255, 235, 235, 0.9);
  border: 1px solid #ffcccc;
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 12px;
  color: #cc2222;
  margin-bottom: 16px;
}

/* ===== DIVIDER ===== */
.divider {
  border: none;
  border-top: 1px solid #f0ede4;
  margin: 20px 0;
}

/* ===== BUTTON ===== */
.btn-submit {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;

  font-size: 15px;
  font-weight: 600;
  color: white;

  background: linear-gradient(135deg, #ffbf00, #ff9900);

  box-shadow: 0 10px 20px rgba(255,153,0,0.25);

  cursor: pointer;
  transition: 0.2s;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 26px rgba(255,153,0,0.3);
}

.btn-submit:active {
  transform: scale(0.98);
}

/* ===== LOGIN LINK ===== */
.login-link {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  color: #777;
}

.login-link a {
  color: #ff9900;
  font-weight: 600;
  text-decoration: none;
}

.login-link a:hover {
  text-decoration: underline;
}

</style>
</head>

<body>

<header>
  <span style="font-size:20px">🥚</span>
  <a th:href="@{/}" class="logo-text">たまログ</a>
</header>

<div class="card">

  <div class="card-header">
    <div class="icon">🐣</div>
    <h1>新規アカウント登録</h1>
    <p>ひとつのたまごから広がる世界</p>
  </div>

  <div class="card-body">
    <form th:action="@{/signup}" th:object="${usersForm}" method="post">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <!-- ユーザー名 -->
      <div class="form-group">
        <label class="form-label">👤 ユーザー名 <span class="required">必須</span></label>
        
        <input type="text"
               class="form-input"
               th:field="*{username}"
               th:classappend="${#fields.hasErrors('username')} ? 'is-error'"
               placeholder="tamagotaro">
<!-- ユーザー名のエラー（th:if を追加） -->
<p class="error-msg" 
   th:if="${#fields.hasErrors('username')}"
   th:errors="*{username}"></p>
        <span class="hint">3〜20文字の半角英数字</span>
<!--        <p class="error-msg" th:errors="*{username}"></p>-->
      </div>

      <!-- パスワード -->
      <div class="form-group">
        <label class="form-label">🔒 パスワード <span class="required">必須</span></label>
        
        <input type="password"
               class="form-input"
               id="passwordInput"
               th:field="*{password}"
               oninput="checkStrength(this.value)">

        <div class="strength-bars">
          <div class="strength-bar" id="sb1"></div>
          <div class="strength-bar" id="sb2"></div>
          <div class="strength-bar" id="sb3"></div>
          <div class="strength-bar" id="sb4"></div>
        </div>

        <span class="strength-label" id="strengthLabel"></span>
        
        <span class="strength-label" id="strengthLabel"></span>
<p class="error-msg"
   th:if="${#fields.hasErrors('password')}"
   th:errors="*{password}"></p>
      </div>

      <!-- 確認 -->
      <div class="form-group">
        <label class="form-label">🔒 パスワード確認</label>

        <input type="password"
               class="form-input"
               id="passwordConfirmInput"
               th:field="*{passwordConfirm}"
               oninput="checkMatch()">

        <p class="error-msg" id="matchError" style="display:none">
          パスワードが一致しません
        </p>
      </div>

      <hr class="divider">

      <button type="submit" class="btn-submit">
        🍳 アカウント作成
      </button>

      <div class="login-link">
        すでにアカウントをお持ちの方は
        <a th:href="@{/login}">ログイン</a>
      </div>

    </form>

  </div>
</div>

<script>
function checkStrength(val) {
  const bars = [sb1, sb2, sb3, sb4];
  const label = document.getElementById("strengthLabel");

  let score = 0;
  if (val.length > 0) score++;
  if (val.length >= 6) score++;
  if (val.length >= 8 && /\d/.test(val)) score++;
  if (val.length >= 10 && /[^a-zA-Z0-9]/.test(val)) score++;

  bars.forEach((b, i) => {
    b.className = "strength-bar";
    if (i < score) {
      const cls = ["weak","fair","good","strong"][score-1];
      b.classList.add(cls);
    }
  });

  label.textContent = score ? ["弱い","まあまあ","良い","強い"][score-1] : "";
}

function checkMatch() {
  const pw = document.getElementById("passwordInput").value;
  const cf = document.getElementById("passwordConfirmInput").value;
  const err = document.getElementById("matchError");

  err.style.display = (cf && pw !== cf) ? "block" : "none";
}
</script>

</body>
</html>
