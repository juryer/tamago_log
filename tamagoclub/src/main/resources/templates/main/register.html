<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Recipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #fff8dc, #ffe9a8);
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(12px);
    border-radius: 30px;
    padding: 32px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    height: fit-content;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.logo-area { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 36px; }
.title { font-size: 28px; font-weight: 600; color: #f0a500; }
.sub-title { color: #777; font-size: 14px; margin-top: 5px; }

.form-section { margin-bottom: 24px; }

.form-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #444;
    margin-bottom: 10px;
}

.form-input {
    width: 100%;
    padding: 15px 16px;
    border: none;
    border-radius: 16px;
    background: white;
    font-size: 14px;
    outline: none;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    transition: 0.2s;
}

.form-input:focus { box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.35); }

.form-textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: none;
    border-radius: 20px;
    padding: 18px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    line-height: 1.8;
    outline: none;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    transition: 0.2s;
}

.form-textarea:focus { box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.35); }

.drop-zone {
    width: 100%;
    height: 240px;
    border: 2px dashed #ffcc66;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    position: relative;
    cursor: pointer;
    transition: 0.25s;
    overflow: hidden;
}

.drop-zone:hover { background: #fff9e7; transform: translateY(-2px); }
.drop-zone.dragover { border-color: #ff9900; background: #fff3c9; }
.drop-icon { font-size: 60px; }

.drop-text {
    color: #777;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
}

.preview-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.btn-remove-img {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    font-size: 18px;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 2;
}

.counter-controls { display: flex; align-items: center; gap: 14px; }

.btn-counter {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-counter:hover { transform: scale(1.08); }

.counter-input {
    width: 90px;
    height: 46px;
    border: none;
    border-radius: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    background: white;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    outline: none;
}

.submit-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #ffbf00, #ff9900);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 8px 20px rgba(255, 170, 0, 0.35);
    font-family: 'Poppins', sans-serif;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(255, 170, 0, 0.45);
}

.category-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.category-group input[type="radio"] {
    display: none;
}

.category-chip {
    padding: 10px 18px;
    border-radius: 999px;
    background: #fffdf7;
    border: 2px solid #ffe4a3;
    color: #666;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
}

.category-chip:hover {
    transform: translateY(-2px);
    background: #fff6d8;
}

.category-group input[type="radio"]:checked + .category-chip {
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    border-color: #ffb300;
    color: white;
    box-shadow: 0 6px 16px rgba(255, 179, 0, 0.3);
}

.footer { margin-top: 20px; text-align: right; }

.back-btn {
    text-decoration: none;
    color: #666;
    font-size: 14px;
    transition: 0.2s;
}

.back-btn:hover { color: #f0a500; }

.error-msg { color: #e74c3c; font-size: 12px; margin-top: 6px; }

.step-item {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: flex-start;
}

.step-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: white;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    line-height: 1.6;
    resize: vertical;
}

.step-remove {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #ff6b6b;
    color: white;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
}

.add-step-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-family: 'Poppins', sans-serif;
}

.add-step-btn:hover { transform: scale(1.03); }

@media (max-width: 480px) {
    .container { padding: 24px; }
    .title { font-size: 24px; }
    .drop-zone { height: 200px; }
}
</style>
</head>

<body>
<div class="container">

    <!-- ヘッダー -->
    <div class="header">
        <div>
            <div class="logo-area">
                <div class="logo">🍳</div>
                <div class="title">たまログ工房</div>
            </div>
            <div class="sub-title">新しいたまごレシピを投稿</div>
        </div>
        <div style="font-size: 28px;">👤</div>
    </div>

    <!-- フォーム -->
    <form th:action="@{/main/new}" th:object="${recipesForm}" method="post" enctype="multipart/form-data">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- メニュー名 -->
        <div class="form-section">
            <label class="form-label">🍽️ メニュー名</label>
            <input type="text" class="form-input" th:field="*{title}" placeholder="例：ふわとろオムライス">
            <p class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <!-- 写真 -->
        <div class="form-section">
            <label class="form-label">📷 レシピ画像</label>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('imageInput').click()">
                <img class="preview-img" id="previewImg" alt="プレビュー">
                <button type="button" class="btn-remove-img" id="btnRemove" onclick="removeImage(event)">✕</button>
                <div class="drop-icon" id="dropIcon">🍳</div>
                <div class="drop-text" id="dropText">
                    <p>クリックまたは<br>ドラッグ&amp;ドロップで画像追加</p>
                </div>
            </div>
            <input type="file" id="imageInput" name="imageFile" accept="image/*"
                   style="display: none;" onchange="handleFile(this.files[0])">
        </div>

        <!-- 卵の数 -->
        <div class="form-section">
            <label class="form-label">🥚 使用するたまご</label>
            <div class="counter-controls">
                <button type="button" class="btn-counter" onclick="changeCount(-1)">−</button>
                <input type="number" id="eggsInput" class="counter-input" min="0" th:field="*{eggs}">
                <button type="button" class="btn-counter" onclick="changeCount(1)">＋</button>
            </div>
            <p class="error-msg" th:if="${#fields.hasErrors('eggs')}" th:errors="*{eggs}"></p>
        </div>

        <!-- カテゴリー -->
        <div class="form-section">
            <label class="form-label">🌎 カテゴリー</label>
            <div class="category-group">
                <input type="radio" id="washoku" name="category" value="和食" th:field="*{category}">
                <label for="washoku" class="category-chip">🍚 和食</label>

                <input type="radio" id="yoshoku" name="category" value="洋食" th:field="*{category}">
                <label for="yoshoku" class="category-chip">🍝 洋食</label>

                <input type="radio" id="chuka" name="category" value="中華" th:field="*{category}">
                <label for="chuka" class="category-chip">🥟 中華</label>

                <input type="radio" id="korean" name="category" value="韓国料理" th:field="*{category}">
                <label for="korean" class="category-chip">🌶️ 韓国</label>

                <input type="radio" id="ethnic" name="category" value="エスニック" th:field="*{category}">
                <label for="ethnic" class="category-chip">🍛 エスニック</label>
            </div>
        </div>

        <!-- 材料 -->
        <div class="form-section">
            <label class="form-label">🥕 材料</label>
            <textarea class="form-textarea"
                      th:field="*{ingredients}"
                      placeholder="例：&#10;卵 2個&#10;ご飯 1杯&#10;しょうゆ 少々"></textarea>
            <p class="error-msg" th:if="${#fields.hasErrors('ingredients')}" th:errors="*{ingredients}"></p>
        </div>

        <!-- 作り方（ステップ式） -->
        <div class="form-section">
            <label class="form-label">🐣 作り方</label>
            <div id="stepsContainer"></div>
            <button type="button" class="add-step-btn" onclick="addStep()">＋ 手順を追加</button>
            <input type="hidden" th:field="*{description}" id="descriptionHidden">
            <p class="error-msg" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <!-- 登録ボタン -->
        <button type="submit" class="submit-btn">🍳 レシピを投稿する</button>

    </form>

    <!-- 戻る -->
    <div class="footer">
        <a th:href="@{/main}" class="back-btn">← TOPへ戻る</a>
    </div>

</div>

<script>
function changeCount(delta) {
    const input = document.getElementById('eggsInput');
    const next = (parseInt(input.value) || 0) + delta;
    if (next >= 0) input.value = next;
}

function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => showPreview(e.target.result);
    reader.readAsDataURL(file);
}

function showPreview(src) {
    document.getElementById('previewImg').src = src;
    document.getElementById('previewImg').style.display = 'block';
    document.getElementById('dropIcon').style.display = 'none';
    document.getElementById('dropText').style.display = 'none';
    document.getElementById('btnRemove').style.display = 'flex';
}

function removeImage(e) {
    e.stopPropagation();
    document.getElementById('previewImg').src = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('dropIcon').style.display = '';
    document.getElementById('dropText').style.display = '';
    document.getElementById('btnRemove').style.display = 'none';
    document.getElementById('imageInput').value = '';
}

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => { dz.classList.remove('dragover'); });
dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        handleFile(file);
        try {
            const dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('imageInput').files = dt.files;
        } catch(err) {}
    }
});

function addStep(value = "") {
    const container = document.getElementById("stepsContainer");
    const div = document.createElement("div");
    div.className = "step-item";
    div.innerHTML = `
        <textarea class="step-input" rows="2" placeholder="例：たまごを割る">${value}</textarea>
        <button type="button" class="step-remove" onclick="removeStep(this)">✕</button>
    `;
    container.appendChild(div);
}

function removeStep(btn) {
    btn.parentElement.remove();
}

// 送信前にstepをまとめてdescriptionに入れる
document.querySelector("form").addEventListener("submit", function () {
    const inputs = document.querySelectorAll(".step-input");
    let result = [];
    inputs.forEach(i => {
        if (i.value.trim() !== "") {
            result.push(i.value.trim());
        }
    });
    document.getElementById("descriptionHidden").value = result.join("\n");
});

// Shift+Enterで次のステップへ、Enterのみは改行
document.addEventListener("keydown", function (e) {
    if (!e.target.classList.contains("step-input")) return;
    if (e.key === "Enter" && e.shiftKey) {
        e.preventDefault();
        const inputs = [...document.querySelectorAll(".step-input")];
        const index = inputs.indexOf(e.target);
        if (index !== -1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        } else {
            addStep();
            setTimeout(() => {
                document.querySelectorAll(".step-input").at(-1).focus();
            }, 0);
        }
    }
});

// 初期1行
addStep();
</script>

</body>
</html>
