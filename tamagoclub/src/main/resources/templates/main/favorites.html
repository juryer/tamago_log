<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気に入り | たまログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #fff8e7, #fffdf8);
    min-height: 100vh;
    padding: 40px 20px;
    color: #333;
}

.container {
    max-width: 700px;
    margin: 0 auto;
}

/* ヘッダー */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    font-size: 42px;
}

.logo h1 {
    font-size: 32px;
    color: #f4a900;
    font-weight: 600;
}

/* レシピカード */
.recipe-card {
    background: #fff;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.25s;
}

.recipe-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
}

.recipe-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.recipe-image {
    width: 70px;
    height: 70px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffd54f, #ffecb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    overflow: hidden;
}

.recipe-info h2 {
    font-size: 18px;
    margin-bottom: 5px;
}

.recipe-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn {
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    text-decoration: none;
    transition: 0.2s;
}

.btn-detail {
    background: #f4a900;
    color: #fff;
}

.btn-detail:hover {
    background: #e29400;
}

.btn-remove {
    background: #fff0f0;
    color: #d33;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
}

.btn-remove:hover {
    background: #ffdede;
}

/* お気に入りアイコン */
.favorite-icon {
    font-size: 22px;
    color: #e74c3c;
}

/* 戻る */
.footer {
    margin-top: 30px;
    text-align: right;
}

.back-btn {
    display: inline-block;
    background: #444;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    transition: 0.2s;
}

.back-btn:hover {
    background: #222;
}

/* データなし */
.empty {
    text-align: center;
    color: #999;
    margin-top: 50px;
    font-size: 16px;
}
</style>
</head>

<body>
<div class="container">

    <!-- ヘッダー -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">❤️</div>
            <h1>お気に入り</h1>
        </div>
        <div style="font-size: 30px;">👤</div>
    </div>
    
     <div class="favorites-count">
			お気に入りレシピ数：<span th:text="${favoriteCount}"></span>件
		</div>

    <!-- お気に入り一覧 -->
    <div th:each="item : ${recipeList}" class="recipe-card">

        <div class="recipe-left">

            <div class="recipe-image">
                <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                     th:src="${item.imageUrl}"
                     style="width: 100%; height: 100%; object-fit: cover;">
                <span th:unless="${item.imageUrl != null and item.imageUrl != ''}">🥚</span>
            </div>

            <div class="recipe-info">
                <h2 th:text="${item.title}">オムライス</h2>
            </div>

        </div>

        <div class="recipe-actions">

            <span class="favorite-icon">❤️</span>

            <a th:href="@{/main/detail/{id}(id=${item.id})}" class="btn btn-detail">
                詳細
            </a>

            <!-- お気に入り解除 -->
            <form th:action="@{/main/favorites/toggle/{id}(id=${item.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-remove">解除</button>
            </form>

        </div>

    </div>

    <!-- データなし -->
    <div th:if="${#lists.isEmpty(recipeList)}" class="empty">
        お気に入りがありません 🥚
    </div>

    <!-- 戻る -->
    <div class="footer">
        <a th:href="@{/main}" class="back-btn">戻る</a>
    </div>

</div>
</body>
</html>
