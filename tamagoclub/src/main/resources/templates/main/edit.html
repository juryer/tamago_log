<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Recipe Edit</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg, #fff8dc, #ffe9a8);
    min-height:100vh;
    padding:40px 16px;
    display:flex;
    justify-content:center;
}

/* カード */
.card{
    width:100%;
    max-width:500px;
    background: rgba(255,255,255,0.82);
    backdrop-filter:blur(12px);
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
}

/* ヘッダー */
.site-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    background:white;
    border-bottom: 1px solid rgba(0,0,0,0.06);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:28px;
}

.site-title{
    font-size:20px;
    font-weight:600;
    color:#f0a500;
}

/* コンテンツ */
.content{
    padding:24px;
}

/* ページタイトル */
.page-title{
    font-size:22px;
    font-weight:600;
    color:#333;
    margin-bottom:24px;
    padding-bottom:14px;
    border-bottom: 1px solid #eee;
}

/* ===== 画像プレビュー ===== */
.image-section{
    margin-bottom:24px;
}

.section-label{
    font-size:15px;
    font-weight:600;
    color:#444;
    margin-bottom:10px;
}

/* 現在の画像 */
.current-image-wrap{
    width:100%;
    aspect-ratio:4 / 3;
    border-radius:18px;
    overflow:hidden;
    background:#f5f5f5;
    margin-bottom:12px;
    position:relative;
}

.current-image-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #fff3c4, #ffd76a);
}

.no-img-icon{ font-size:60px; margin-bottom:8px; }
.no-img-text{ color:#777; font-size:13px; }

/* ドロップゾーン */
.drop-zone{
    width:100%;
    border: 2px dashed #cccccc;
    border-radius:18px;
    padding:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    background:#fafafa;
    transition:0.2s;
    position:relative;
    overflow:hidden;
}

.drop-zone:hover, .drop-zone.dragover{
    border-color:#f0a500;
    background:#fffbef;
}

.drop-icon{ font-size:36px; }
.drop-text{ font-size:13px; color:#888; text-align:center; line-height:1.6; }

.preview-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:16px;
}

.btn-remove-img{
    position:absolute;
    top:10px;
    right:10px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    font-size:14px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2;
}

#imageInput{ display:none; }

.image-note{
    font-size:11px;
    color:#aaa;
    margin-top:8px;
    display:block;
}

/* 切替ボタン */
.toggle-wrap{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.toggle-btn{
    flex:1;
    padding:8px;
    font-size:13px;
    font-weight:500;
    font-family:'Poppins', sans-serif;
    border: 1.5px solid #ddd;
    border-radius:10px;
    background:white;
    color:#888;
    cursor:pointer;
    transition:0.15s;
}

.toggle-btn.active{
    border-color:#f0a500;
    color:#f0a500;
    background:#fffbef;
    font-weight:600;
}

/* ===== フォームフィールド ===== */
.form-group{
    margin-bottom:22px;
}

.form-label{
    font-size:15px;
    font-weight:600;
    color:#444;
    margin-bottom:8px;
    display:block;
}

.form-input{
    width:100%;
    padding:14px 16px;
    font-size:14px;
    font-family:'Poppins', sans-serif;
    border: 1.5px solid #ddd;
    border-radius:14px;
    outline:none;
    background:white;
    color:#333;
    transition:border-color 0.2s;
}

.form-input:focus{
    border-color:#f0a500;
}

/* 卵カウンター */
.counter-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}

.btn-counter {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-counter:hover {
    transform: scale(1.08);
}

.btn-counter:hover{
    border-color:#f0a500;
    color:#f0a500;
}

.counter-input{
    width:70px;
    height:40px;
    text-align:center;
    font-size:18px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    border: 1.5px solid #ddd;
    border-radius:12px;
    outline:none;
    color:#333;
}

.counter-input:focus{
    border-color:#f0a500;
}

/* テキストエリア */
.form-textarea{
    width:100%;
    height:160px;
    padding:14px 16px;
    font-size:14px;
    font-family:'Poppins', sans-serif;
    border: 1.5px solid #ddd;
    border-radius:14px;
    outline:none;
    resize:vertical;
    color:#333;
    line-height:1.8;
    transition:border-color 0.2s;
}

.form-textarea:focus{
    border-color:#f0a500;
}

/* エラー */
.error-msg{
    font-size:12px;
    color:#e53935;
    margin-top:4px;
}

/* ===== ボタン ===== */
.button-area{
    display:flex;
    gap:12px;
    justify-content:flex-end;
    margin-top:8px;
}

.btn{
    text-decoration:none;
    padding:14px 20px;
    border-radius:14px;
    color:white;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    font-size:14px;
    border:none;
    cursor:pointer;
    transition:0.2s;
    display:inline-block;
    text-align:center;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
}

.btn-submit{
    background: linear-gradient(135deg, #69c069, #3d9e3d);
}

.btn-back{
    background:#444;
}

/* スマホ */
@media (max-width:480px){
    .content{ padding:20px; }
    .button-area{ flex-direction:column; }
    .btn{ text-align:center; }
}

.step-item{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.step-input{
    flex:1;
    padding:12px 14px;
    border:1.5px solid #ddd;
    border-radius:12px;
    font-size:14px;
}

.step-remove{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#ff6b6b;
    color:white;
    cursor:pointer;
}

.add-step-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-family: 'Poppins', sans-serif;
}

.add-step-btn:hover { transform: scale(1.03); }

</style>

</head>

<body>

<div class="card">

    <!-- ヘッダー -->
    <div class="site-header">
        <div class="logo-area">
            <div class="logo">🍳</div>
            <div class="site-title">たまログ</div>
        </div>
        <div>👤</div>
    </div>

    <div class="content">

        <div class="page-title">✏️ レシピを編集する</div>

        <!--
          POST /main/edit/{id}
          Controller で渡すもの:
            model.addAttribute("itemForm", form)  ← 既存データを詰めたフォーム
            model.addAttribute("item", item)      ← item.id / item.imageUrl 用
        -->
        <form th:action="@{/main/edit/{id}(id=${item.id})}"
              th:object="${itemForm}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- ===== 画像 ===== -->
            <div class="image-section">
                <div class="section-label">📷 料理の写真</div>

                <!-- 現在の画像 / 変更 の切替 -->
                <div class="toggle-wrap">
                    <button type="button" class="toggle-btn active"
                            id="btnKeep" onclick="showKeep()">現在の画像</button>
                    <button type="button" class="toggle-btn"
                            id="btnChange" onclick="showChange()">画像を変更する</button>
                </div>

                <!-- 現在の画像 -->
                <div id="currentImageArea">
                    <div class="current-image-wrap">
                        <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                             th:src="${item.imageUrl}"
                             th:alt="${item.title}">
                        <div class="no-image"
                             th:unless="${item.imageUrl != null and item.imageUrl != ''}">
                            <div class="no-img-icon">🍳</div>
                            <div class="no-img-text">No Image</div>
                        </div>
                    </div>
                </div>

                <!-- 新画像アップロード（初期非表示） -->
                <div id="newImageArea" style="display:none;">
                    <div class="drop-zone" id="dropZone"
                         onclick="document.getElementById('imageInput').click()">
                        <img class="preview-img" id="previewImg" alt="プレビュー">
                        <button type="button" class="btn-remove-img" id="btnRemove"
                                onclick="removeImage(event)">✕</button>
                        <span class="drop-icon">🍳</span>
                        <span class="drop-text" id="dropText">
                            クリックまたは<br>ドラッグ＆ドロップで変更
                        </span>
                    </div>
                    <span class="image-note">※ 空のまま送信すると現在の画像を維持します</span>
                </div>

                <input type="file" id="imageInput" name="imageFile"
                       accept="image/jpeg,image/png,image/webp"
                       onchange="handleFile(this.files[0])">
            </div>

            <!-- ===== メニュー名 ===== -->
            <div class="form-group">
                <label class="form-label">🍽️ メニュー名</label>
                <input type="text"
                       class="form-input"
                       th:field="*{title}"
                       placeholder="例：たまごサンドイッチ">
                <p class="error-msg"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"></p>
            </div>

            <!-- ===== 使う卵の数 ===== -->
            <div class="form-group">
                <label class="form-label">🥚 使う卵の数</label>
                <div class="counter-wrap">
                    <button type="button" class="btn-counter"
                            onclick="changeCount(-1)">－</button>
                    <input type="number"
                           class="counter-input"
                           th:field="*{eggs}"
                           min="0"
                           id="eggsInput">
                    <button type="button" class="btn-counter"
                            onclick="changeCount(1)">＋</button>
                </div>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('eggs')}"
                   th:errors="*{eggs}"></p>
            </div>
            
             <!-- カテゴリー -->
<div class="form-section">
    <label class="form-label">🌎 カテゴリー</label>

    <div class="category-group">
        <input type="radio" id="washoku" name="category" value="和食" th:field="*{category}">
        <label for="washoku" class="category-chip">🍚 和食</label>

        <input type="radio" id="yoshoku" name="category" value="洋食" th:field="*{category}">
        <label for="yoshoku" class="category-chip">🍝 洋食</label>

        <input type="radio" id="chuka" name="category" value="中華" th:field="*{category}">
        <label for="chuka" class="category-chip">🥟 中華</label>

        <input type="radio" id="korean" name="category" value="韓国料理" th:field="*{category}">
        <label for="korean" class="category-chip">🌶️ 韓国</label>

        <input type="radio" id="ethnic" name="category" value="エスニック" th:field="*{category}">
        <label for="ethnic" class="category-chip">🍛 エスニック</label>
    </div>
</div>
       <!-- 材料 -->
<div class="form-section">
    <label class="form-label">🥕 材料</label>

    <textarea class="form-textarea"
              th:field="*{ingredients}"
              placeholder="例：
卵 2個
ご飯 1杯
しょうゆ 少々"></textarea>

    <p class="error-msg"
       th:if="${#fields.hasErrors('ingredients')}"
       th:errors="*{ingredients}">
    </p>
</div>     

           <!-- ===== つくりかた ===== -->
<div class="form-group">
    <label class="form-label">🐣 つくりかた</label>

    <div id="stepsContainer"></div>
<!--<div class="step-item">-->
<!--    <div class="step-number"></div>-->
<!--    <textarea class="step-input"></textarea>-->
<!--    <button type="button" class="step-remove">✕</button>-->
<!--</div>-->
<!--    <button type="button"-->
<!--            class="btn-counter"-->
<!--            onclick="addStep()">-->
<!--        ＋-->
<!--    </button>-->
<button type="button" class="add-step-btn" onclick="addStep()">＋ 手順を追加</button>

    <input type="hidden"
           th:field="*{description}"
           id="descriptionHidden">

    <p class="error-msg"
       th:if="${#fields.hasErrors('description')}"
       th:errors="*{description}"></p>
</div>

            <!-- ===== ボタン ===== -->
            <div class="button-area">
                <a th:href="@{/main/detail/{id}(id=${item.id})}"
                   class="btn btn-back">戻る</a>
                <button type="submit" class="btn btn-submit">
                    更新する ✅
                </button>
            </div>

        </form>
        <script th:inline="javascript">
    const initialSteps = /*[[${steps}]]*/ [];
</script>

    </div>

</div>

<script>
    // ---- 卵カウンター ----
    function changeCount(delta) {
        const input = document.getElementById('eggsInput');
        const next = (parseInt(input.value) || 0) + delta;
        if (next >= 0) input.value = next;
    }

    // ---- 画像切替 ----
    function showKeep() {
        document.getElementById('currentImageArea').style.display = '';
        document.getElementById('newImageArea').style.display = 'none';
        document.getElementById('btnKeep').classList.add('active');
        document.getElementById('btnChange').classList.remove('active');
        document.getElementById('imageInput').value = '';
    }

    function showChange() {
        document.getElementById('currentImageArea').style.display = 'none';
        document.getElementById('newImageArea').style.display = '';
        document.getElementById('btnKeep').classList.remove('active');
        document.getElementById('btnChange').classList.add('active');
    }

    // ---- 画像プレビュー ----
    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => showPreview(e.target.result);
        reader.readAsDataURL(file);
    }

    function showPreview(src) {
        document.getElementById('previewImg').src = src;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('dropText').style.display = 'none';
        document.getElementById('btnRemove').style.display = 'flex';
    }

    function removeImage(e) {
        e.stopPropagation();
        document.getElementById('previewImg').src = '';
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('dropText').style.display = '';
        document.getElementById('btnRemove').style.display = 'none';
        document.getElementById('imageInput').value = '';
    }

    // ---- ドラッグ＆ドロップ ----
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', (e) => {
        e.preventDefault();
        dz.classList.add('dragover');
    });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', (e) => {
        e.preventDefault();
        dz.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            handleFile(file);
            try {
                const dt = new DataTransfer();
                dt.items.add(file);
                document.getElementById('imageInput').files = dt.files;
            } catch(err) {}
        }
    });

   function addStep(value = "") {
    const container = document.getElementById("stepsContainer");
    const div = document.createElement("div");
    div.className = "step-item";

    div.innerHTML = `
        <textarea class="step-input"
                  rows="2"
                  placeholder="手順を入力...">${value}</textarea>
        <button type="button"
                class="step-remove"
                onclick="removeStep(this)">✕</button>
    `;

    container.appendChild(div);
}

    function removeStep(btn) {
        btn.parentElement.remove();
    }

    document.querySelector("form").addEventListener("submit", function () {

        const values = [];

        document.querySelectorAll(".step-input").forEach(input => {
            if (input.value.trim() !== "") {
                values.push(input.value.trim());
            }
        });

        document.getElementById("descriptionHidden").value =
            values.join("\n");
    });
    window.addEventListener("DOMContentLoaded", () => {
        if (initialSteps && initialSteps.length > 0) {
            initialSteps.forEach(v => {
                if (v.trim() !== "") addStep(v);
            });
        } else {
            addStep(); // 空なら1個だけ
        }
    });
    
    document.addEventListener("keydown", function (e) {
    if (!e.target.classList.contains("step-input")) return;

    // Shift + Enter → 次のステップへ移動
    if (e.key === "Enter" && e.shiftKey) {
        e.preventDefault();
        const inputs = [...document.querySelectorAll(".step-input")];
        const index = inputs.indexOf(e.target);
        if (index !== -1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        } else {
            addStep();
            setTimeout(() => {
                document.querySelectorAll(".step-input").at(-1).focus();
            }, 0);
        }
    }
    // Enter単体 → 普通に改行（何もしない）
});
    
    function updateStepNumbers() {
        document.querySelectorAll(".step-item").forEach((item, index) => {
            const num = item.querySelector(".step-number");
            if (num) num.textContent = index + 1;
        });
    }
    
</script>

</body>
</html>
