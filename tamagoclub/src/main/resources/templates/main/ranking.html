<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>たまログアワード</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins', sans-serif;

    background:
    linear-gradient(
        135deg,
        #fff8dc,
        #ffe9a8
    );

    min-height:100vh;

    padding:40px 20px;
}

/* コンテナ */

.container{

    max-width:700px;

    margin:0 auto;
}

/* タイトル */

.header{

    text-align:center;

    margin-bottom:35px;
}

.header-icon{

    font-size:60px;

    margin-bottom:10px;
}

.header h1{

    font-size:38px;

    color:#f0a500;

    font-weight:600;
}

.sub-title{

    margin-top:8px;

    color:#777;

    font-size:14px;
}

/* ランキングカード */

.rank-list{

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* カード */

.rank-card{

    background:white;

    border-radius:24px;

    padding:22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.08);

    transition:0.25s;
}

.rank-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 12px 28px rgba(0,0,0,0.12);
}

/* 左 */

.rank-left{

    display:flex;

    align-items:center;

    gap:18px;
}

/* 順位 */

.rank-number{

    width:60px;
    height:60px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:bold;

    color:white;
}

/* 色 */

.gold{
    background:
    linear-gradient(
        135deg,
        #ffd700,
        #ffb300
    );
}

.silver{
    background:
    linear-gradient(
        135deg,
        #d9d9d9,
        #aaaaaa
    );
}

.bronze{
    background:
    linear-gradient(
        135deg,
        #cd7f32,
        #9c5a1a
    );
}

.normal{
    background:
    linear-gradient(
        135deg,
        #ffcc66,
        #ff9900
    );
}

/* 情報 */

.recipe-info h2{

    font-size:22px;

    margin-bottom:6px;

    color:#333;
}

.recipe-info p{

    color:#888;

    font-size:14px;
}

/* アクセス */

.access-badge{

    background:#fff5d6;

    color:#d48800;

    padding:8px 14px;

    border-radius:30px;

    font-size:14px;

    font-weight:600;
}

/* ボタン */

.detail-btn{

    margin-left:15px;

    text-decoration:none;

    background:
    linear-gradient(
        135deg,
        #ffbf00,
        #ff9900
    );

    color:white;

    padding:12px 18px;

    border-radius:14px;

    font-size:14px;

    font-weight:600;

    transition:0.2s;
}

.detail-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 6px 18px rgba(255,170,0,0.35);
}

/* 戻る */

.footer{

    margin-top:35px;

    text-align:right;
}

.back-btn{

    display:inline-block;

    text-decoration:none;

    background:#444;

    color:white;

    padding:12px 22px;

    border-radius:14px;

    transition:0.2s;
}

.back-btn:hover{

    background:#222;
}

/* データなし */

.empty{

    text-align:center;

    color:#999;

    margin-top:50px;

    font-size:15px;
}

.category-tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 5px 20px;
    margin-bottom:20px;
}

.tab{
    flex-shrink:0;
    padding:10px 16px;
    border-radius:999px;
    background:#fff;
    color:#666;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    border:1px solid #eee;
    transition:0.2s;
    white-space:nowrap;
}

.tab:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

.tab.active{
    background:linear-gradient(135deg,#ffbf00,#ff9900);
    color:white;
    border:none;
}

.rank-image{
    width:70px;
    height:70px;
    border-radius:14px;
    overflow:hidden;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
}

.rank-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-img{
    font-size:28px;
    color:#aaa;
}

.rank-card:nth-child(1){
    border:2px solid gold;
}

</style>

</head>

<body>

<div class="container">

    <!-- タイトル -->
    <div class="header">

        <div class="header-icon">
            🏆
        </div>

        <h1>
            たまログトレンド
        </h1>

        <div class="sub-title">
            人気のたまごレシピランキング
        </div>

    </div>

    <!-- ランキング -->
    <div class="rank-list">
  <!-- カテゴリタブ -->
<div class="category-tabs">

    <a th:href="@{/main/ranking}"
       class="tab"
       th:classappend="${currentCategory == null} ? 'active'">
        全体
    </a>

    <a th:href="@{/main/ranking?category=和食}"
       class="tab"
       th:classappend="${currentCategory == '和食'} ? 'active'">
        和食
    </a>

    <a th:href="@{/main/ranking?category=洋食}"
       class="tab"
       th:classappend="${currentCategory == '洋食'} ? 'active'">
        洋食
    </a>

    <a th:href="@{/main/ranking?category=中華}"
       class="tab"
       th:classappend="${currentCategory == '中華'} ? 'active'">
        中華
    </a>

    <a th:href="@{/main/ranking?category=韓国}"
       class="tab"
       th:classappend="${currentCategory == '韓国'} ? 'active'">
        韓国
    </a>

    <a th:href="@{/main/ranking?category=エスニック}"
       class="tab"
       th:classappend="${currentCategory == 'エスニック'} ? 'active'">
        エスニック
    </a>

</div>

        <div th:each="item, stat : ${rankingList}"
             class="rank-card">

            <!-- 左 -->
            <div class="rank-left">

                <!-- 順位 -->
                <div class="rank-number"
     th:classappend="
     ${stat.index == 0} ? 'gold' :
     (${stat.index == 1} ? 'silver' :
     (${stat.index == 2} ? 'bronze' : 'normal'))">

    <span th:text="${stat.index + 1}"></span>
</div>

<!-- 画像追加ここ -->
<div class="rank-image">

    <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
         th:src="${item.imageUrl}"
         alt="recipe image" />

    <div th:if="${item.imageUrl == null or item.imageUrl == ''}"
         class="no-img">
        🍳
    </div>

</div>

<div class="recipe-info">
    <h2 th:text="${item.title}">オムライス</h2>
</div>

            </div>

            <!-- 右 -->
            <div style="display:flex; align-items:center;">

                <div class="access-badge">

                    👁
                    <span th:text="${item.accessCount}">
                    </span>

                </div>

                <a th:href="@{/main/detail/{id}(id=${item.id})}" class="detail-btn">

                    詳細 →

                </a>

            </div>

        </div>

        <!-- データなし -->
        <div th:if="${#lists.isEmpty(rankingList)}"
             class="empty">

            ランキングデータがありません 🥚

        </div>

    </div>

    <!-- 戻る -->
    <div class="footer">

        <a th:href="@{/main}"
           class="back-btn">

            ← 戻る

        </a>

    </div>

</div>

</body>
</html>
